<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusTube - Weekly Focus Dashboard</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --accent-blue: #38bdf8;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff334b 0%, #d90429 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-title span {
      color: #ff4d4d;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Section Cards */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Weekly Focus Score HTML/CSS Bar Chart */
    .chart-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      height: 180px;
      padding-top: 24px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .chart-bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 8px;
    }

    .bar-value {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .bar-track {
      width: 100%;
      max-width: 44px;
      height: 100%;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      width: 100%;
      border-radius: 8px 8px 0 0;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bar-fill.high { background: linear-gradient(180deg, #10b981 0%, #059669 100%); }
    .bar-fill.mid { background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); }
    .bar-fill.low { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); }

    .bar-label {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      white-space: nowrap;
    }

    /* Session History Cards */
    .history-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .session-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .session-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .session-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .session-goal-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-goal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .session-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .score-badge.high { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .score-badge.mid { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .score-badge.low { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

    .session-stats-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-label { color: var(--text-dim); }
    .stat-val { font-weight: 700; color: var(--text-main); }

    .observation-box {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      background: rgba(168, 85, 247, 0.08);
      border-left: 3px solid var(--accent-purple);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
    }

    .empty-history {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">
          <img src="icons/icon-48.png" width="28" height="28" alt="FocusTube Logo">
        </div>
        <div class="brand-text">
          <div class="brand-title">Focus<span>Tube</span> Dashboard</div>
          <div class="brand-subtitle">Weekly Focus Analytics & History</div>
        </div>
      </div>
      <a href="https://www.youtube.com" target="_blank" class="btn-outline">
        <span>Open YouTube</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
      </a>
    </header>

    <!-- Weekly Focus Score Trend Chart (Last 7 Sessions) -->
    <div class="section-card">
      <div class="section-header">
        <div>
          <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#38BDF8">
              <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>
            </svg>
            Weekly Focus Trend (Last 7 Sessions)
          </div>
          <div class="section-subtitle">Visual score history per study session</div>
        </div>
      </div>

      <div id="chartContainer" class="chart-container">
        <!-- Bars dynamically populated by dashboard.js -->
        <div class="empty-history">Loading focus trend chart...</div>
      </div>
    </div>

    <!-- Past Sessions History Cards -->
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#A855F7">
            <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
          Past Session Summaries
        </div>
      </div>

      <div id="historyGrid" class="history-grid">
        <!-- History cards dynamically populated by dashboard.js -->
        <div class="empty-history">Loading session history...</div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
